sourceSets.main.java.srcDirs = ["src/"]

project.ext.mainClassName = "mindustry.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets")

def JDK_DIR = "$System.env.JDK_DIR"
def ICON_DIR = new File("$rootDir/core/assets/icons/icon.icns")
def platforms = ["Linux64", "Windows64", "MacOS"]

tasks.register('run', JavaExec){
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    if(System.getProperty("os.name").toLowerCase().contains("mac")){
        jvmArgs("-XstartOnFirstThread")
    }

    jvmArgs += "-XX:+ShowCodeDetailsInExceptionMessages"

    if(project.hasProperty("args")){
        args Eval.me(project.getProperties()["args"])
    }

    if(project.hasProperty("jvmArgs")){
        jvmArgs((List<String>) Eval.me(project.getProperties()["jvmArgs"]))
    }

    if(project.hasProperty("dataDir")){
        environment("MINDUSTRY_DATA_DIR", project.getProperties()["dataDir"])
    }

    if(args.contains("debug")){
        mainClass = "mindustry.debug.DebugLauncher"
    }
}

// Launch two desktop clients from one Gradle invocation:
//   client #1 -> default data directory (MINDUSTRY_DATA_DIR cleared)
//   client #2 -> temp/client2, override with -PdataDir2=<path>
// Optional: -Pargs='[...]' for both, -Pargs2='[...]' for client #2 only, -PjvmArgs='[...]' for both.
tasks.register('runDual'){
    group = 'application'
    description = 'Launches two desktop clients: #1 uses the default data directory; #2 uses temp/client2 (override with -PdataDir2=...).'
    dependsOn classes

    if(!project.ext.hasSprites() && System.getenv("JITPACK") != "true"){
        dependsOn ":tools:pack"
    }

    doLast{
        def osName = System.getProperty("os.name").toLowerCase()
        def javaExe = new File(System.getProperty("java.home"), "bin/java" + (osName.contains("windows") ? ".exe" : ""))
        def classpath = sourceSets.main.runtimeClasspath.asPath
        def baseJvmArgs = ["-XX:+ShowCodeDetailsInExceptionMessages"]
        if(osName.contains("mac")){
            baseJvmArgs << "-XstartOnFirstThread"
        }
        if(project.hasProperty("jvmArgs")){
            baseJvmArgs.addAll((List<String>)Eval.me(project.getProperties()["jvmArgs"]))
        }

        def clientArgs = project.hasProperty("args") ? (List<String>)Eval.me(project.getProperties()["args"]) : []
        def client2Args = project.hasProperty("args2") ? (List<String>)Eval.me(project.getProperties()["args2"]) : clientArgs
        def main1 = clientArgs.contains("debug") ? "mindustry.debug.DebugLauncher" : project.mainClassName
        def main2 = client2Args.contains("debug") ? "mindustry.debug.DebugLauncher" : project.mainClassName

        def dataDir2 = project.hasProperty("dataDir2") ? file(project.getProperties()["dataDir2"]) : new File(rootDir, "temp/client2")
        dataDir2.mkdirs()

        def command1 = [javaExe.absolutePath] + baseJvmArgs + ["-cp", classpath, main1] + clientArgs
        def command2 = [javaExe.absolutePath] + baseJvmArgs + ["-cp", classpath, main2] + client2Args

        // assetsDir is "../core/assets" relative to the desktop project. ProcessBuilder resolves
        // relative directories against the Gradle daemon CWD, not the project dir — use project.file().
        def assetsDir = project.file(project.assetsDir)

        def pb1 = new ProcessBuilder(command1)
        pb1.directory(assetsDir)
        pb1.environment().remove("MINDUSTRY_DATA_DIR")
        pb1.inheritIO()

        def pb2 = new ProcessBuilder(command2)
        pb2.directory(assetsDir)
        pb2.environment().put("MINDUSTRY_DATA_DIR", dataDir2.absolutePath)
        pb2.inheritIO()

        logger.lifecycle("runDual client #1: default data directory (MINDUSTRY_DATA_DIR cleared)")
        logger.lifecycle("runDual client #2: MINDUSTRY_DATA_DIR=${dataDir2.absolutePath}")

        def process1 = pb1.start()
        def process2 = pb2.start()
        def exit1 = process1.waitFor()
        def exit2 = process2.waitFor()
        logger.lifecycle("runDual client #1 exited with code ${exit1}")
        logger.lifecycle("runDual client #2 exited with code ${exit2}")
    }
}

// Launch multiple desktop clients from one Gradle invocation (default 4):
//   client #1 -> default data directory (MINDUSTRY_DATA_DIR cleared)
//   client #k -> temp/client<k>, override with -PdataDir<k>=<path>
// Optional: -Pclients=<count>, -Pargs='[...]' for all, -Pargs<k>='[...]' per client, -PjvmArgs='[...]' for all.
tasks.register('runMulti'){
    group = 'application'
    description = 'Launches multiple desktop clients (default 4; -Pclients=N). #1 uses the default data directory; #k uses temp/clientN (override with -PdataDirN=...).'
    dependsOn classes

    if(!project.ext.hasSprites() && System.getenv("JITPACK") != "true"){
        dependsOn ":tools:pack"
    }

    doLast{
        int clientCount = 4
        if(project.hasProperty("clients")){
            clientCount = project.getProperties()["clients"].toString().toInteger()
        }
        if(clientCount < 1) throw new GradleException("-Pclients must be >= 1")

        def osName = System.getProperty("os.name").toLowerCase()
        def javaExe = new File(System.getProperty("java.home"), "bin/java" + (osName.contains("windows") ? ".exe" : ""))
        def classpath = sourceSets.main.runtimeClasspath.asPath
        def baseJvmArgs = ["-XX:+ShowCodeDetailsInExceptionMessages"]
        if(osName.contains("mac")){
            baseJvmArgs << "-XstartOnFirstThread"
        }
        if(project.hasProperty("jvmArgs")){
            baseJvmArgs.addAll((List<String>)Eval.me(project.getProperties()["jvmArgs"]))
        }

        def sharedArgs = project.hasProperty("args") ? (List<String>)Eval.me(project.getProperties()["args"]) : []
        // assetsDir is "../core/assets" relative to the desktop project. ProcessBuilder resolves
        // relative directories against the Gradle daemon CWD, not the project dir — use project.file().
        def assetsDir = project.file(project.assetsDir)
        def launched = []

        (1..clientCount).each{ i ->
            def clientArgs = sharedArgs
            if(i > 1 && project.hasProperty("args${i}")){
                clientArgs = (List<String>)Eval.me(project.getProperties()["args${i}"])
            }
            def mainClass = clientArgs.contains("debug") ? "mindustry.debug.DebugLauncher" : project.mainClassName

            File dataDir = null
            if(i > 1){
                dataDir = project.hasProperty("dataDir${i}") ? file(project.getProperties()["dataDir${i}"]) : new File(rootDir, "temp/client${i}")
                dataDir.mkdirs()
            }

            def command = [javaExe.absolutePath] + baseJvmArgs + ["-cp", classpath, mainClass] + clientArgs
            def pb = new ProcessBuilder(command)
            pb.directory(assetsDir)
            if(dataDir == null){
                pb.environment().remove("MINDUSTRY_DATA_DIR")
                logger.lifecycle("runMulti client #${i}: default data directory (MINDUSTRY_DATA_DIR cleared)")
            }else{
                pb.environment().put("MINDUSTRY_DATA_DIR", dataDir.absolutePath)
                logger.lifecycle("runMulti client #${i}: MINDUSTRY_DATA_DIR=${dataDir.absolutePath}")
            }
            pb.inheritIO()
            launched << [index: i, process: pb.start()]
        }

        launched.each{ entry ->
            logger.lifecycle("runMulti client #${entry.index} exited with code ${entry.process.waitFor()}")
        }
    }
}

tasks.register('dist', Jar){
    dependsOn configurations.runtimeClasspath
    dependsOn ":desktop:processResources"
    // Shared Campaign JVM_PROCESS Actions use the real dedicated server entry point. Merge the server
    // classes/runtime directly instead of consuming server:dist's archive output. This keeps the desktop artifact
    // self-contained while avoiding an ambiguous server:dist -> tests project artifact dependency in Gradle 9+.
    dependsOn ":server:classes"

    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from{ configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) } }
    from{ project(":server").sourceSets.main.output }
    from{ project(":server").configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) } }
    from files(project.assetsDir)
    exclude("config/**")
    exclude("**hs_err**.log")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    //don't include steam shared libraries unless necessary
    if(!versionModifier.contains("steam")){
        exclude("**steam**.so", "**steam**.dll", "**steam**.dylib")
    }

    archiveFileName = "${appName}.jar"

    manifest{
        attributes 'Main-Class': project.mainClassName
        //note: this doesn't do anything when launched from the bundled JVM
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
        attributes 'Multi-Release': 'true'
    }
}

if(!project.ext.hasSprites() && System.getenv("JITPACK") != "true"){
    println "Scheduling sprite packing."
    run.dependsOn ":tools:pack"
    dist.dependsOn ":tools:pack"
}

//this is only for local testing
//add -Prelease -PversionModifier=steam as build properties
tasks.register('steamtest'){
    dependsOn dist
    doLast{
        copy{
            from "build/libs/Mindustry.jar"
            if(project.hasProperty("destination")){
                into project.property("destination")
            }else if(System.properties["os.name"].contains("Mac")){
                into "/Users/anuke/Library/Application Support/Steam/steamapps/common/Mindustry/Mindustry.app/Contents/Resources"
            }else{
                into "/home/anuke/.steam/steam/steamapps/common/Mindustry/jre"
            }
            rename("Mindustry.jar", "desktop.jar")
        }
    }
}

//required templates:
//- Windows32: Not provided by Packr! This uses Java 8
//required JDKs:
//- Windows64
//- Linux64
//- Mac
platforms.each{ platform ->
    task "packr${platform.toString()}"{
        dependsOn dist

        doLast{
            copy{
                into "build/packr/"
                rename("${appName}.jar", "desktop.jar")
                from "build/libs/${appName}.jar"
            }

            delete{
                delete "build/packr/output/"
            }

            def jarPath = JDK_DIR + "packr.jar"
            def args = new String[]{"java", "-jar", jarPath}

            args += new String[]{
                "--platform", platform == "MacOS" ? "Mac" : platform.toString(),
                "--jdk", JDK_DIR + "jre-${platform.toString().toLowerCase()}",
                "--executable", appName,
                "--classpath", "$rootDir/desktop/build/packr/desktop.jar".toString(),
                "--mainclass", project.ext.mainClassName,
                "--verbose",
                "--bundle", getPackage() + ".mac",
                "--icon", ICON_DIR,
                "--output", "$rootDir/desktop/build/packr/output".toString(),
                "--removelibs", "$rootDir/desktop/build/packr/desktop.jar".toString()
            }

            args += "--vmargs"

            if(platform == "MacOS"){
                args += "XstartOnFirstThread"
            }

            args += "Dhttps.protocols=TLSv1.2,TLSv1.1,TLSv1"
            args += "XX:+ShowCodeDetailsInExceptionMessages"
            args += "XX:+UseCompactObjectHeaders"
            args += "enable-native-access=ALL-UNNAMED"

            project.services.get(ExecOperations).exec{
                commandLine args.toList()
                standardOutput = System.out
            }

            def outputJsonFile = platform != "MacOS" ? file("build/packr/output/Mindustry.json") : file("build/packr/output/${appName}.app/Contents/Resources/Mindustry.json")

            if(platform != "MacOS"){
                copy{
                    into "build/packr/output/jre/"
                    from "build/packr/output/desktop.jar"
                }

                delete{
                    delete "build/packr/output/desktop.jar"
                }

                outputJsonFile.text = outputJsonFile.text.replace("desktop.jar", "jre/desktop.jar")
            }else{
                copy{
                    into "build/packr/output/${appName}.app/Contents/"
                    from "build/packr/output/Contents/"
                }

                delete{
                    delete "build/packr/output/Contents/"
                }
            }

            //packr is broken and won't let me add one hyphen, so I have to do that myself later
            outputJsonFile.text = outputJsonFile.text.replace("-enable-native-access=ALL-UNNAMED", "--enable-native-access=ALL-UNNAMED")

            if((platform == "Windows64")){
                copy{
                    from "build/packr/output/jre/bin/msvcr100.dll"
                    into "build/packr/output/"
                    rename("msvcr100.dll", "MSVCR100.dll")
                }
            }

            if(versionModifier.contains("steam")){
                copy{
                    def lib = platform == "MacOS" || platform == "Linux64" ? "lib" : ""
                    from zipTree(platform == "MacOS" ? "build/packr/output/${appName}.app/Contents/Resources/desktop.jar" : "build/packr/output/jre/desktop.jar").matching{
                        include "${lib}frogworks${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                        include "${lib}steam_api${platform == "Windows64" ? '64.dll' : platform == "Linux64" ? '.so' : '.dylib'}"
                    }
                    into platform != "MacOS" ? "build/packr/output/" : "build/packr/output/${appName}.app/Contents/Resources"
                }
            }

            copy{
                from "build/packr/output"
                into "../deploy/${platform.toString()}"
            }
        }

        task "zip${platform.toString()}"(type: Zip){
            from "build/packr/output"
            archiveFileName = "${generateDeployName(platform.toString())}.zip"
            destinationDirectory = (file("../deploy"))

            doLast{
                delete{
                    delete "build/packr/"
                }
            }
        }

        finalizedBy "zip${platform.toString()}"

    }
}
